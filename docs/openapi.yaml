      properties:
        sessionToken:
          type: string
          description: Opaque bearer token for subsequent admin API calls.
        user:
          $ref: "#/components/schemas/AdminUser"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AdminScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true

