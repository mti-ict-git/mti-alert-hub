openapi: 3.1.0
info:
  title: MTI Alert Server API
  version: 0.3.0
  description: |
    Authoritative API contract for the MTI Alert central server.

    This contract covers:
    - admin authentication and scope-aware operations
    - communication draft management and audience preview
    - organization and device reference data
    - template policy retrieval
    - future delivery, response, dashboard, and Windows Agent integration contracts

    Phase note:
    - `Phase 4` is the current implementation focus for hardening and production-oriented rollout.
    - Operations marked with `x-implementation-phase` greater than `Phase 4`
      remain documented for downstream alignment.
servers:
  - url: https://api.example.com
    description: Production placeholder
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
    description: Admin authentication and current session endpoints.
  - name: Communications
    description: Communication draft lifecycle endpoints.
  - name: Templates
    description: Template and policy retrieval endpoints.
  - name: Workflows
    description: Reusable response workflow definition endpoints.
  - name: Audience
    description: Audience resolution and publish preview endpoints.
  - name: Reference
    description: Organization reference endpoints used for targeting and filtering.
  - name: Employees
    description: Sync-safe employee directory read models.
  - name: Devices
    description: Registered Windows Agent device read models for admin use.
  - name: Health
    description: Service health and operational diagnostics endpoints.
  - name: Agent
    description: Windows Agent session, realtime, heartbeat, and message endpoints.
  - name: Deliveries
    description: Delivery tracking and delivery status endpoints.
  - name: Responses
    description: Recipient response retrieval endpoints.
  - name: Dashboard
    description: Monitoring and summary endpoints.
  - name: Audit
    description: Admin audit trail endpoints.
security:
  - AdminSessionAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Get public service health
      description: Returns lightweight service health and echoes `X-Request-Id` for request correlation.
      operationId: getHealth
      security: []
      parameters:
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Service health
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/diagnostics:
    get:
      tags: [Health]
      summary: Get authenticated operational diagnostics
      description: |
        Returns backend diagnostics intended for operator troubleshooting and go-live validation.

        Current Phase 4 note:
        - Confirms database reachability, current enabled release-scope channels, admin and agent session counts, and realtime-hub/device connectivity summaries.
        - Returns explicit `alerts` for warning and critical operational conditions such as expiring sessions or stale realtime connectivity.
        - This endpoint is admin-protected because it exposes operational detail that should not be public.
      operationId: getHealthDiagnostics
      x-implementation-phase: Phase 4
      responses:
        "200":
          description: Operational diagnostics
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDiagnosticsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login an admin user
      description: Authenticates an admin operator through directory-backed credentials and returns the MTI Alert session context.
      operationId: loginAdmin
      x-implementation-phase: Phase 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current admin user
      operationId: logoutAdmin
      x-implementation-phase: Phase 1
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current admin session
      operationId: getCurrentAdminSession
      x-implementation-phase: Phase 1
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/rotate-session:
    post:
      tags: [Auth]
      summary: Rotate current admin session token
      description: |
        Rotates the current authenticated admin session token and invalidates the previous bearer token immediately.

        Current Phase 4 note:
        - This is the baseline admin token-rotation control for the desktop-first live path.
        - Clients must replace the stored bearer token with the returned `sessionToken`.
      operationId: rotateAdminSession
      x-implementation-phase: Phase 4
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /communications:
    get:
      tags: [Communications]
      summary: List communications
      operationId: listCommunications
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CommunicationStatusQuery"
        - $ref: "#/components/parameters/CommunicationTypeQuery"
        - $ref: "#/components/parameters/PriorityQuery"
        - $ref: "#/components/parameters/TemplateIdQuery"
      responses:
        "200":
          description: Communication list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Communications]
      summary: Create a communication draft
      description: Creates a communication draft using delivery channels currently enabled for the active release scope.
      operationId: createCommunicationDraft
      x-implementation-phase: Phase 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunicationRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /communications/{communicationId}:
    get:
      tags: [Communications]
      summary: Get communication detail
      operationId: getCommunicationDetail
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Communications]
      summary: Update a communication draft
      description: Only drafts may be updated. Template-locked fields must be rejected if overridden, and channel selections outside the enabled release scope must be rejected.
      operationId: updateCommunicationDraft
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunicationRequest"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /communications/{communicationId}/reminder-activity:
    get:
      tags: [Communications]
      summary: Get hybrid reminder policy activity and reconciled reminder events
      description: |
        Returns reminder-policy materialization state and locally reported reminder evidence for a reminder communication.

        Current Phase 4 note:
        - This endpoint supports admin monitoring for `AgentLocalRoutine` reminders.
        - It is intended for reminder-specific operator visibility, not for the Windows Agent sync path itself.
      operationId: getCommunicationReminderActivity
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Reminder policy activity and reminder events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderActivityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communications/{communicationId}/duplicate:
    post:
      tags: [Communications]
      summary: Duplicate a communication draft
      description: Creates a new draft from an existing communication while preserving allowed policy snapshots and references.
      operationId: duplicateCommunicationDraft
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "201":
          description: Draft duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /communications/{communicationId}/audience-preview:
    post:
      tags: [Audience]
      summary: Resolve target rules into recipient preview and publish plan
      description: Returns the resolved audience, channel plan, and preview warnings for a draft before publication.
      operationId: previewCommunicationAudience
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Audience preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudiencePreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /communications/{communicationId}/publish:
    post:
      tags: [Communications]
      summary: Publish or schedule a communication
      description: |
        Validates publish guardrails and accepts supported publication modes.

        Current Phase 2 note:
        - `publishMode = Now` is accepted into an execution-ready backend state.
        - `publishMode = Scheduled` is accepted into a scheduled backend state with persisted timezone context.
        - `publishMode = Recurring` is accepted into a recurring schedule foundation with persisted execution mode and validity metadata.
        - Publish acceptance now also writes immutable recipient snapshots, queued delivery job foundations, initial delivery attempts, and queue lifecycle events for the accepted execution record.
        - The selected channels must remain within the currently enabled release scope, such as `WindowsAgent` for the desktop-first live path.
        - Materialized Windows Agent reminder policies and downstream delivery orchestration remain implemented in later Phase 2 slices.
      operationId: publishCommunication
      x-implementation-phase: Phase 2
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishCommunicationRequest"
      responses:
        "200":
          description: Publish accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /communications/{communicationId}/cancel:
    post:
      tags: [Communications]
      summary: Cancel a scheduled or active communication
      description: |
        Cancels an accepted scheduled communication or an execution-ready communication before downstream delivery orchestration finishes.
      operationId: cancelCommunication
      x-implementation-phase: Phase 2
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /communications/{communicationId}/deliveries:
    get:
      tags: [Deliveries]
      summary: List delivery jobs and status for a communication
      description: |
        Returns the thin delivery visibility baseline for the admin communication detail flow.

        Current Phase 2 note:
        - The response includes paged delivery jobs, persisted recipient snapshots, and recent delivery event logs.
        - Recipient snapshots come from publish-time `communication_recipients`.
        - Recipient snapshots and delivery rows now distinguish `Device`, `Employee`, and `ContactEndpoint` monitoring contexts, including device references and routed contact endpoints where available.
        - Delivery jobs and delivery events come from the current orchestration persistence model and are intended for first-line operational support, not full dashboard analytics.
      operationId: listCommunicationDeliveries
      x-implementation-phase: Phase 2
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Delivery status list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communications/{communicationId}/responses:
    get:
      tags: [Responses]
      summary: List recipient responses for a communication
      description: |
        Returns the current admin response-monitoring baseline for one communication.

        Current Phase 3 note:
        - The response list is derived from persisted `Responded` delivery events for the communication.
        - `actorUserIdentifier` is sourced from the Windows Agent or compatible-channel response payload when available.
        - This endpoint supports thin operator monitoring and response drill-down before broader reporting and dashboard slices are completed.
      operationId: listCommunicationResponses
      x-implementation-phase: Phase 3
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Response list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communications/{communicationId}/deliveries/{deliveryJobId}/response:
    post:
      tags: [Responses]
      summary: Record a compatible-channel response for a delivery job
      description: |
        Records a workflow response for a non-Windows-Agent delivery job using the persisted workflow snapshot on the recipient.

        Current Phase 3 note:
        - This is the thin compatible-channel response ingestion baseline for `ContactEndpoint`-style deliveries before full provider callback modules are implemented.
        - A successful response writes a `Responded` delivery event, updates `communication_recipients.response_state`, and applies `response implies ack` semantics when configured by the workflow snapshot.
        - Windows Agent responses must continue using `POST /agent/messages/{messageId}/response`.
      operationId: submitCompatibleChannelResponse
      x-implementation-phase: Phase 3
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
        - $ref: "#/components/parameters/DeliveryJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibleChannelResponseRequest"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /templates:
    get:
      tags: [Templates]
      summary: List communication templates
      operationId: listCommunicationTemplates
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /templates/{templateId}:
    get:
      tags: [Templates]
      summary: Get communication template detail
      operationId: getCommunicationTemplate
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workflows:
    get:
      tags: [Workflows]
      summary: List reusable response workflow definitions
      description: Returns the validated workflow definitions currently available for communication drafting and response evaluation. The current MVP baseline serves a managed canonical workflow set that is reconciled during backend bootstrap.
      operationId: listWorkflowDefinitions
      x-implementation-phase: Phase 3
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Workflow definition list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reference/organization:
    get:
      tags: [Reference]
      summary: Get organization reference data for targeting
      operationId: getOrganizationReference
      x-implementation-phase: Phase 1
      responses:
        "200":
          description: Organization reference payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationReference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reference/sites:
    get:
      tags: [Reference]
      summary: List available sites
      operationId: listSites
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Site list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reference/areas:
    get:
      tags: [Reference]
      summary: List available areas
      operationId: listAreas
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Area list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reference/departments:
    get:
      tags: [Reference]
      summary: List available departments
      operationId: listDepartments
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reference/sections:
    get:
      tags: [Reference]
      summary: List available sections
      operationId: listSections
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DepartmentIdQuery"
      responses:
        "200":
          description: Section list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /employees:
    get:
      tags: [Employees]
      summary: List sync-safe employee directory records
      description: Returns employee read models used for targeting, channel availability, and operator filtering. This endpoint does not imply employee-authenticated behavior.
      operationId: listEmployees
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SiteIdQuery"
        - $ref: "#/components/parameters/AreaIdQuery"
        - $ref: "#/components/parameters/DepartmentIdQuery"
        - $ref: "#/components/parameters/SectionIdQuery"
      responses:
        "200":
          description: Employee list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices:
    get:
      tags: [Devices]
      summary: List registered Windows Agent devices
      description: |
        Returns device-centric read models used for targeting, operational visibility, and monitoring.

        Current Phase 4 note:
        - Devices may now include best-effort directory enrichment for the latest active desktop user reported by the agent.
        - That enrichment is informational only and does not replace device trust or authoritative employee master-data contracts.
      operationId: listDevices
      x-implementation-phase: Phase 1
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SiteIdQuery"
        - $ref: "#/components/parameters/AreaIdQuery"
        - $ref: "#/components/parameters/DeviceStatusQuery"
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices/pending:
    get:
      tags: [Devices]
      summary: List pending Windows Agent device approval requests
      description: |
        Returns Windows Agent enrollment attempts that have not been approved into the trusted `public.devices`
        baseline yet.

        Current Phase 4 note:
        - Unknown devices still cannot create trusted sessions silently.
        - The agent `POST /agent/session` path records or refreshes a pending request instead of requiring an
          operator to pre-register every hostname manually.
        - The admin `Devices` experience uses this queue to approve or reject newly seen endpoints.
      operationId: listPendingDeviceEnrollments
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Pending device enrollment requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingDeviceEnrollmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices/rollout-packages/local/{fileName}:
    delete:
      tags: [Devices]
      summary: Remove a published local MSI package from the Desktop Agent registry
      description: |
        Deletes a previously uploaded MSI from the shared `Settings > Desktop Agent` package registry so
        operators can republish a rebuilt package with the same file name or version.
      operationId: deleteDeviceRolloutPackage
      x-implementation-phase: Phase 4
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local rollout package removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRolloutDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/pending/{requestId}/approve:
    post:
      tags: [Devices]
      summary: Approve a pending Windows Agent device
      description: |
        Approves a pending enrollment request and creates a trusted baseline record in `public.devices`.

        Current Phase 4 note:
        - Approval remains the trust gate for unknown Windows Agent endpoints.
        - The next agent retry can then create a normal trusted session without reinstalling the MSI.
      operationId: approvePendingDeviceEnrollment
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePendingDeviceRequest"
      responses:
        "201":
          description: Pending device approved and baseline device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovePendingDeviceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /devices/pending/{requestId}/reject:
    post:
      tags: [Devices]
      summary: Reject a pending Windows Agent device
      description: |
        Rejects a pending enrollment request without creating a trusted device record.
      operationId: rejectPendingDeviceEnrollment
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPendingDeviceRequest"
      responses:
        "200":
          description: Pending device rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectPendingDeviceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /devices/rollout-packages/local:
    get:
      tags: [Devices]
      summary: List locally published rollout MSI packages
      description: |
        Returns MSI packages currently available under `backend/local-packages` for operator-selected frontend rollout.

        Current Phase 4 note:
        - This is the admin-side convenience surface for rollout testing from the `Devices` page.
        - The backend always recomputes `sha256`.
        - If signature metadata cannot be inspected from the backend runtime, operators may still supply the signer thumbprint manually before applying the rollout.
      operationId: listDeviceRolloutPackages
      x-implementation-phase: Phase 4
      responses:
        "200":
          description: Local rollout packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRolloutPackageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices/rollout-packages/upload:
    post:
      tags: [Devices]
      summary: Upload a local rollout MSI package into the global Desktop Agent package registry
      description: |
        Accepts a raw MSI file upload from the authenticated admin browser, stores it in the backend-local
        package area, inspects rollout metadata, and returns the resulting package entry for the global
        Desktop Agent package registry.

        Current Phase 4 note:
        - The browser is the upload source; the frontend container does not read local operator files directly.
        - The backend persists the uploaded file into `backend/local-packages` and must therefore run on
          durable storage when used in Docker or shared environments.
        - Upload belongs to the shared `Settings > Desktop Agent` package-management surface; device rollout
          dialogs only select from the already uploaded package registry.
        - Upload does not sign or mutate the MSI; it only stores and inspects the exact artifact received.
        - The published file name is stable; operators may keep using a canonical name such as
          `MTI.Alert.Agent.Setup.msi` while the backend tracks version, `sha256`, and signer thumbprint as
          metadata instead of encoding those values into the file name.
        - If the uploaded MSI resolves to the same published file name as an existing package, the backend now
          reuses the existing file when the hash matches, or replaces the stored file in place when the hash
          differs. Operators do not need to rename the MSI just to republish a rebuilt package with the same
          version.
        - Automated build pipelines may send authoritative package metadata through `X-Package-Metadata`
          (base64-encoded JSON). The backend persists that metadata as the package-registry sidecar manifest
          so the admin UI can display the correct version and signer thumbprint even when runtime signature
          inspection is unavailable on the backend host.
      operationId: uploadDeviceRolloutPackage
      x-implementation-phase: Phase 4
      parameters:
        - in: header
          name: X-File-Name
          required: true
          schema:
            type: string
          description: Original MSI file name selected by the operator browser.
        - in: header
          name: X-Package-Metadata
          required: false
          schema:
            type: string
          description: Base64-encoded JSON containing authoritative rollout package metadata (`version`, `sha256`, `thumbprint`, `signatureStatus`, `signatureStatusMessage`, `signerSubject`, `signerIssuer`, `rolloutCommand`).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/x-msi:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Local rollout package uploaded and inspected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRolloutUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices/{deviceId}/rollouts:
    post:
      tags: [Devices]
      summary: Preview or create a device-scoped Windows Agent rollout
      description: |
        Validates or applies a single-device rollout intent using explicit package metadata from the admin `Devices` page.

        Current Phase 4 note:
        - `apply=false` performs a dry run so operators can validate target resolution and package metadata before mutation.
        - `apply=true` upserts the release package, deactivates prior active rollout intents for the device, and inserts a fresh active intent.
        - This endpoint does not sign or repackage MSI files; it assumes the selected package is already signed and immutable.
      operationId: createDeviceRollout
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRolloutRequest"
      responses:
        "200":
          description: Rollout dry run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRolloutPreviewResponse"
        "201":
          description: Rollout intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRolloutApplyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /devices/{deviceId}/test-notification:
    post:
      tags: [Devices]
      summary: Send a device-scoped Windows Agent test notification
      description: |
        Creates and immediately publishes a one-time `OperationalNotice` communication targeted to a single device.

        Current Phase 4 note:
        - This action is intended for operator connectivity checks from the `Devices` admin view.
        - Only devices currently reported as `Online` are eligible.
        - The resulting communication is visible in Notification Center and follows the standard Windows Agent delivery flow.
      operationId: sendDeviceTestNotification
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTestNotificationRequest"
      responses:
        "201":
          description: Test notification created and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTestNotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /devices/{deviceId}/revoke-session:
    post:
      tags: [Devices]
      summary: Revoke active device access
      description: |
        Revokes persisted Windows Agent sessions for a device, disconnects active realtime connections, and marks the device offline.

        Current Phase 4 note:
        - This is the baseline device trust control for the desktop-first release path.
        - Existing device tokens become invalid immediately after revocation.
      operationId: revokeDeviceSession
      x-implementation-phase: Phase 4
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agent/session:
    post:
      tags: [Agent]
      summary: Create or refresh a Windows Agent session
      description: |
        Creates a persisted device session for an approved Windows Agent device.

        Current Phase 2 note:
        - Session trust is device-centric and stored in `device_sessions`.
        - Refreshing a session rotates the opaque token and invalidates the previous device token.
        - `employeeNumber` and `activeUserIdentifier` are optional metadata and do not replace device trust.
        - `activeUserIdentifier` may be used for best-effort directory enrichment of the device read model.
        - The latest `activeUserIdentifier` is retained on the active device session for audit context and shared-device pending-message replay suppression.
        - When the endpoint is still unknown, the server records or refreshes a pending enrollment request and returns a conflict response instead of creating a trusted session automatically.
      operationId: createAgentSession
      x-implementation-phase: Phase 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionRequest"
      responses:
        "200":
          description: Agent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/realtime/negotiate:
    post:
      tags: [Agent]
      summary: Negotiate a realtime Windows Agent connection
      description: |
        Requires a valid persisted agent session and rejects requests that try to negotiate for a different device identifier.

        Current Phase 2 note:
        - The negotiation response now returns the concrete realtime hub URL exposed by the backend runtime.
        - When `BACKEND_PUBLIC_BASE_URL` is unset, the backend derives that URL from the inbound request host.
        - If `BACKEND_PUBLIC_BASE_URL` is set to a loopback host such as `localhost`, the backend now ignores that override whenever the inbound request host is a non-loopback address, preventing remote Windows Agent clients from being sent back to themselves.
        - The first compatible hub slice uses `transport = SSE`.
        - The compatibility access token currently reuses the persisted agent session token until a dedicated hub token issuer is introduced.
      operationId: negotiateAgentRealtimeConnection
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRealtimeNegotiationRequest"
      responses:
        "200":
          description: Realtime connection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRealtimeNegotiationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/realtime-hub:
    get:
      tags: [Agent]
      summary: Open the negotiated realtime hub stream for the Windows Agent
      description: |
        Opens the first compatible realtime hub transport for the calling Windows Agent session.

        Current Phase 2 note:
        - The current implementation uses Server-Sent Events (`text/event-stream`).
        - The client must use the `connectionUrl` or the returned `connectionId` from `POST /agent/realtime/negotiate`.
        - The stream emits an initial `connected` event, a `messages.snapshot` event after connect, and `messages.available` whenever queued Windows Agent delivery jobs are published for the connected device.
        - `GET /agent/messages` remains the required reconciliation fallback after reconnect or suspected event loss.
      operationId: openAgentRealtimeHub
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - in: query
          name: connectionId
          required: true
          schema:
            type: string
        - in: query
          name: deviceIdentifier
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Realtime SSE stream opened successfully
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/heartbeat:
    post:
      tags: [Agent]
      summary: Report device heartbeat
      description: |
        Updates Windows Agent liveness for the device bound to the current persisted session.

        Current Phase 2 note:
        - The bearer token must resolve to the same device as the `deviceIdentifier` in the payload.
        - Successful heartbeat updates `lastHeartbeatAt` and refreshes persisted device status metadata.
      operationId: reportAgentHeartbeat
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHeartbeatRequest"
      responses:
        "204":
          description: Heartbeat accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/rollout-intent:
    get:
      tags: [Agent]
      summary: Fetch approved rollout intent for the calling Windows Agent device
      description: |
        Returns the current approved rollout intent for the device bound to the calling persisted agent session.

        Current Phase 4 note:
        - This endpoint is intentionally limited to approved rollout metadata such as target version, package URL, checksum, and signature.
        - The backend must not use this endpoint to send arbitrary shell commands or free-form scripts.
        - When no rollout is currently assigned to the device, the response remains valid with `intent = null`.
      operationId: getAgentRolloutIntent
      x-implementation-phase: Phase 4
      security:
        - AgentSessionAuth: []
      responses:
        "200":
          description: Approved rollout intent or explicit no-op state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRolloutIntentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agent/rollout-status:
    post:
      tags: [Agent]
      summary: Report updater lifecycle status for a rollout intent
      description: |
        Records updater lifecycle status reported by the calling Windows Agent device for an approved rollout intent.

        Current Phase 4 note:
        - This endpoint is intended for updater progress and terminal result reporting.
        - The status payload may include installed version, updater version, startup-registration visibility, and structured error detail.
        - Rollout status remains device-scoped and must not be accepted for another device.
      operationId: reportAgentRolloutStatus
      x-implementation-phase: Phase 4
      security:
        - AgentSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRolloutStatusRequest"
      responses:
        "204":
          description: Rollout status recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/messages:
    get:
      tags: [Agent]
      summary: Fetch pending messages for the Windows Agent
      description: |
        Returns persisted Windows Agent delivery jobs that still require device reconciliation.

        Current Phase 2 note:
        - Results come from `delivery_jobs` and `communication_recipients`, not placeholder memory state.
        - The response remains valid when no pending messages exist.
        - Only delivery jobs whose schedule is active and already inside the effective delivery window are returned.
        - Recurring and explicitly bounded schedules stop syncing after `communication_schedules.valid_until`.
        - One-time `Immediate` or `Scheduled` Windows Agent messages also stop syncing after a bounded replay window derived from backend configuration when no explicit `valid_until` exists.
        - Already `Read` or `Responded` Windows Agent jobs are not returned as pending reconciliation items.
        - When prior device lifecycle evidence is already stamped with a different `activeUserIdentifier`, that job is omitted from later pending sync for the current session to reduce cross-user replay on shared devices.
      operationId: listPendingAgentMessages
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - in: query
          name: since
          required: false
          description: Optional reconciliation cursor or timestamp.
          schema:
            type: string
      responses:
        "200":
          description: Pending messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agent/reminder-policies:
    get:
      tags: [Agent]
      summary: Fetch active locally executable reminder policies for the Windows Agent
      description: |
        Returns `AgentLocalRoutine` reminder policy changes synchronized for the calling device.

        Current Phase 2 note:
        - Policies are materialized from recurring `communication_schedules` into `agent_reminder_policies`.
        - The sync response may include inactive policy rows so the Windows Agent can deactivate replaced or cancelled local policies without waiting for expiry.
        - Initial implementation currently syncs only device-bound Windows Agent reminder recipients.
      operationId: listAgentReminderPolicies
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - in: query
          name: since
          required: false
          description: Optional cursor or timestamp used to fetch changed reminder policies only.
          schema:
            type: string
      responses:
        "200":
          description: Active reminder policies eligible for bounded local execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReminderPolicyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agent/reminder-policies/{policyId}/events:
    post:
      tags: [Agent]
      summary: Report a locally executed reminder occurrence or interaction
      description: Records local Windows Agent reminder evidence for an active synced policy owned by the calling device.
      operationId: reportAgentReminderPolicyEvent
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ReminderPolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentReminderEventRequest"
      responses:
        "204":
          description: Reminder policy event recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/messages/{messageId}/displayed:
    post:
      tags: [Agent]
      summary: Mark a Windows Agent message as displayed
      description: Records authoritative `Displayed` evidence for the calling device and keeps duplicate submissions idempotent.
      operationId: markAgentMessageDisplayed
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLifecycleEventRequest"
      responses:
        "204":
          description: Display recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/messages/{messageId}/read:
    post:
      tags: [Agent]
      summary: Mark a Windows Agent message as read
      description: Records authoritative `Read` evidence for the calling device and keeps duplicate submissions idempotent.
      operationId: markAgentMessageRead
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLifecycleEventRequest"
      responses:
        "204":
          description: Read recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agent/messages/{messageId}/response:
    post:
      tags: [Agent]
      summary: Submit a response from the Windows Agent
      description: |
        Validates the persisted workflow snapshot for the message and records a Windows Agent response.

        Current Phase 2 note:
        - Only messages that require a response and carry a workflow snapshot can be answered.
        - A successful response transitions the delivery job to `Responded` and updates recipient response state.
      operationId: submitAgentMessageResponse
      x-implementation-phase: Phase 2
      security:
        - AgentSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentResponseRequest"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary metrics
      description: |
        Returns the current operator dashboard summary baseline.

        Current Phase 3 note:
        - The overview is backed by persisted communications, recipient snapshots, workflows, and delivery jobs.
        - The current baseline includes counts for active communications, recipients still pending acknowledgement or response, delivered jobs, responding recipients, failed jobs, and overdue response recipients.
        - Richer trend analytics, activity-feed aggregation, and channel comparison reporting remain later Phase 3 work.
      operationId: getDashboardOverview
      x-implementation-phase: Phase 3
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/content-type-rollups:
    get:
      tags: [Dashboard]
      summary: Get delivery and response rollups by content type
      description: |
        Returns the current reporting baseline for tracked communication content types.

        Current Phase 3 note:
        - The response groups persisted communication, recipient, workflow, and delivery state by `communicationType`.
        - The baseline is intended for operator reporting screens that need delivery and response rollups without introducing derived reporting tables yet.
        - Each row includes communication counts, recipient counts, active communication counts, delivered/read/responded/failed counts, pending responses, and overdue responses for the tracked content type.
      operationId: getDashboardContentTypeRollups
      x-implementation-phase: Phase 3
      responses:
        "200":
          description: Dashboard content-type rollups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardContentTypeRollupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      description: |
        Returns the current audit trail baseline for operator and support investigation.

        Current Phase 3 note:
        - The response lists append-only audit records for representative communication lifecycle actions.
        - The baseline currently captures publish acceptance, cancel acceptance, template override rejection, response recording, overdue transitions, and recipient-only follow-up queue events.
        - Audit records are intended to explain lifecycle intent and user action context beyond raw delivery tables.
      operationId: listAuditLogs
      x-implementation-phase: Phase 3
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: module
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  headers:
    RequestId:
      description: Correlation identifier for tracing the request through backend logs.
      schema:
        type: string
  securitySchemes:
    AdminSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: "Opaque bearer admin session token issued by `POST /auth/login` and sent through the `Authorization: Bearer <token>` header."
    AgentSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Bearer token or equivalent device session token issued to a Windows Agent.

  parameters:
    CommunicationId:
      in: path
      name: communicationId
      required: true
      schema:
        type: string
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema:
        type: string
    TemplateId:
      in: path
      name: templateId
      required: true
      schema:
        type: string
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        type: string
    DeliveryJobId:
      in: path
      name: deliveryJobId
      required: true
      schema:
        type: string
    ReminderPolicyId:
      in: path
      name: policyId
      required: true
      schema:
        type: string
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Search:
      in: query
      name: search
      required: false
      schema:
        type: string
    CommunicationStatusQuery:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/CommunicationStatus"
    CommunicationTypeQuery:
      in: query
      name: type
      required: false
      schema:
        $ref: "#/components/schemas/CommunicationType"
    PriorityQuery:
      in: query
      name: priority
      required: false
      schema:
        $ref: "#/components/schemas/Priority"
    TemplateIdQuery:
      in: query
      name: templateId
      required: false
      schema:
        type: string
    SiteIdQuery:
      in: query
      name: siteId
      required: false
      schema:
        type: string
    AreaIdQuery:
      in: query
      name: areaId
      required: false
      schema:
        type: string
    DepartmentIdQuery:
      in: query
      name: departmentId
      required: false
      schema:
        type: string
    SectionIdQuery:
      in: query
      name: sectionId
      required: false
      schema:
        type: string
    DeviceStatusQuery:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/DeviceStatus"

  responses:
    Unauthorized:
      description: Authentication is required or the provided credential is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is authenticated but not authorized to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current resource state or policy constraints.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    CommunicationType:
      type: string
      enum: [Alert, Reminder, OperationalNotice, News, Article, KnowledgeUpdate]
    Priority:
      type: string
      enum: [Info, Warning, Critical]
    Channel:
      type: string
      enum: [WindowsAgent, WhatsApp, Email, DigitalSignage]
    CommunicationStatus:
      type: string
      enum: [Draft, Scheduled, Queued, Sending, Active, Completed, Cancelled, Failed]
    DeliveryStrategy:
      type: string
      enum: [UserPreference, MultiSend, PrimaryFallback, TemplatePolicy]
    ScopeType:
      type: string
      enum: [Global, Site, Area, Department, Section]
    TargetType:
      type: string
      enum: [All, Site, Area, Department, Section, Role, Employee, Group, Device]
    WindowsAgentPresentation:
      type: string
      enum: [Toast, Modal, Fullscreen]
    CriticalBehaviorMode:
      type: string
      enum: [ModalThenStronger, FixedModal, FullscreenImmediate]
    DeviceStatus:
      type: string
      enum: [Online, Offline, Stale]
    AgentRolloutAction:
      type: string
      enum: [Upgrade, Repair, Uninstall]
    AgentRolloutPackageType:
      type: string
      enum: [MSI]
    AgentRolloutState:
      type: string
      enum:
        [UpdateAvailable, Downloading, Staged, InstallPending, Installing, Succeeded, Failed, UninstallPending, Uninstalling, Uninstalled]
    DeliveryJobStatus:
      type: string
      enum: [Pending, Sent, Delivered, Displayed, Read, Responded, Failed]
    DeliveryEventType:
      type: string
      enum: [Queued, Sent, Delivered, Displayed, Read, Overdue, Responded, Failed]
    RecipientType:
      type: string
      enum: [Device, Employee, ContactEndpoint]
    ScheduleExecutionMode:
      type: string
      enum: [ServerGenerated, AgentLocalRoutine]
    ReminderEventType:
      type: string
      enum: [Triggered, Displayed, Read, Dismissed, Snoozed, Responded, Started, StepAdvanced, Completed, TimedOut]

    PageMeta:
      type: object
      required: [page, pageSize, totalItems]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
          nullable: true

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          nullable: true

    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"

    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthSession:
      type: object
      required: [sessionToken, user, scopes, expiresAt]
      properties:
        sessionToken:
          type: string
          description: Opaque bearer token for subsequent admin API calls.
        user:
          $ref: "#/components/schemas/AdminUser"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AdminScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true

    AdminUser:
      type: object
      required: [id, username, fullName, roleType]
      properties:
        id:
          type: string
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        roleType:
          type: string
          enum: [CentralAdmin, LocalOperator, ManagementViewer]

    AdminScope:
      type: object
      required: [scopeType, scopeValue]
      properties:
        scopeType:
          $ref: "#/components/schemas/ScopeType"
        scopeValue:
          type: string

    CommunicationSummary:
      type: object
      required: [id, communicationType, priority, title, status, channelSelections]
      properties:
        id:
          type: string
        communicationType:
          $ref: "#/components/schemas/CommunicationType"
        priority:
          $ref: "#/components/schemas/Priority"
        title:
          type: string
        status:
          $ref: "#/components/schemas/CommunicationStatus"
        category:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        templateId:
          type: string
          nullable: true
        templateVersion:
          type: integer
          nullable: true
        channelSelections:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        createdAt:
          type: string
          format: date-time
          nullable: true
        recipientsCount:
          type: integer
        ackCount:
          type: integer

    CommunicationDetail:
      allOf:
        - $ref: "#/components/schemas/CommunicationSummary"
        - type: object
          required: [body, targets]
          properties:
            body:
              type: string
              maxLength: 320
            instruction:
              type: string
              nullable: true
            category:
              type: string
              nullable: true
            requiresResponse:
              type: boolean
            windowsAgentPresentation:
              allOf:
                - $ref: "#/components/schemas/WindowsAgentPresentation"
              nullable: true
            toastAutoDismissSeconds:
              type: integer
              nullable: true
              minimum: 1
              maximum: 60
              description: Optional Windows Agent toast display duration override in seconds. Applied only when the presentation resolves to `Toast`.
            deliveryStrategy:
              allOf:
                - $ref: "#/components/schemas/DeliveryStrategy"
              nullable: true
            schedule:
              allOf:
                - $ref: "#/components/schemas/CommunicationScheduleDetail"
              nullable: true
              description: >
                For published communications this is the persisted publish schedule. For draft reminders
                without a publish schedule yet, the API may surface the stored recurring draft definition here
                so the authoring flow can reopen recurrence settings before publish.
            wellnessProgram:
              allOf:
                - $ref: "#/components/schemas/WellnessProgramPayload"
              nullable: true
              description: >
                Optional structured payload for specialized wellness reminder experiences shown from the
                dedicated `Wellness Programs` flow under Notifications.
            workflow:
              allOf:
                - $ref: "#/components/schemas/WorkflowDefinition"
              nullable: true
            targets:
              type: array
              items:
                $ref: "#/components/schemas/TargetRule"
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true

    CommunicationListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationSummary"
        page:
          $ref: "#/components/schemas/PageMeta"

    CreateCommunicationRequest:
      type: object
      required:
        - communicationType
        - priority
        - title
        - body
        - channelSelections
        - targets
      properties:
        communicationType:
          $ref: "#/components/schemas/CommunicationType"
        priority:
          $ref: "#/components/schemas/Priority"
        category:
          type: string
          nullable: true
        templateId:
          type: string
          nullable: true
        title:
          type: string
        body:
          type: string
          maxLength: 320
        instruction:
          type: string
          nullable: true
          description: Optional instruction text. When the Windows Agent channel is enabled, `Info + Toast` is normalized to `null` and `Warning` requires a non-empty instruction.
        channelSelections:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetRule"
        workflowId:
          type: string
          nullable: true
        windowsAgentPresentation:
          allOf:
            - $ref: "#/components/schemas/WindowsAgentPresentation"
          nullable: true
          description: Optional Windows Agent presentation override. `Warning` is normalized to `Modal` when the desktop channel is selected.
        toastAutoDismissSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: Optional Windows Agent toast display duration override in seconds. Persisted for `Toast` and ignored for non-toast presentations.
        deliveryStrategy:
          allOf:
            - $ref: "#/components/schemas/DeliveryStrategy"
          nullable: true
        reminderSchedule:
          allOf:
            - $ref: "#/components/schemas/ReminderDraftScheduleRequest"
          nullable: true
        wellnessProgram:
          allOf:
            - $ref: "#/components/schemas/WellnessProgramPayload"
          nullable: true
          description: >
            Optional structured payload for specialized wellness reminder experiences. Intended for the
            dedicated `Wellness Programs` authoring flow under Notifications.
        confirmLockedFieldPolicy:
          type: boolean
          description: Optional client assertion that locked template fields have not been overridden.
          nullable: true

    UpdateCommunicationRequest:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        category:
          type: string
          nullable: true
        templateId:
          type: string
          nullable: true
        title:
          type: string
        body:
          type: string
          maxLength: 320
        instruction:
          type: string
          nullable: true
          description: Optional instruction text. When the Windows Agent channel is enabled, `Info + Toast` is normalized to `null` and `Warning` requires a non-empty instruction.
        channelSelections:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetRule"
        workflowId:
          type: string
          nullable: true
        windowsAgentPresentation:
          allOf:
            - $ref: "#/components/schemas/WindowsAgentPresentation"
          nullable: true
          description: Optional Windows Agent presentation override. `Warning` is normalized to `Modal` when the desktop channel is selected.
        toastAutoDismissSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: Optional Windows Agent toast display duration override in seconds. Persisted for `Toast` and ignored for non-toast presentations.
        deliveryStrategy:
          allOf:
            - $ref: "#/components/schemas/DeliveryStrategy"
          nullable: true
        reminderSchedule:
          allOf:
            - $ref: "#/components/schemas/ReminderDraftScheduleRequest"
          nullable: true
        wellnessProgram:
          allOf:
            - $ref: "#/components/schemas/WellnessProgramPayload"
          nullable: true
          description: >
            Optional structured payload for specialized wellness reminder experiences. Intended for the
            dedicated `Wellness Programs` authoring flow under Notifications.

    PublishCommunicationRequest:
      type: object
      required: [publishMode, confirmedPreview]
      properties:
        publishMode:
          type: string
          enum: [Now, Scheduled, Recurring]
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        recurrenceRule:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        executionMode:
          allOf:
            - $ref: "#/components/schemas/ScheduleExecutionMode"
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        confirmedPreview:
          type: boolean
          description: Indicates the operator confirmed the preview and channel plan before publishing.

    ReminderDraftScheduleRequest:
      type: object
      required: [recurrenceRule, timezone, executionMode]
      properties:
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        recurrenceRule:
          type: string
        timezone:
          type: string
        executionMode:
          allOf:
            - $ref: "#/components/schemas/ScheduleExecutionMode"
        validUntil:
          type: string
          format: date-time
          nullable: true

    WellnessProgramPayload:
      type: object
      required: [programType, theme, layoutVariant, actions]
      properties:
        programType:
          $ref: "#/components/schemas/WellnessProgramType"
        theme:
          $ref: "#/components/schemas/WellnessTheme"
        layoutVariant:
          $ref: "#/components/schemas/WellnessLayoutVariant"
        heroAssetUrl:
          type: string
          nullable: true
        countdownSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3600
        rotationMode:
          type: string
          enum: [Fixed, Sequential, Random]
          nullable: true
        actions:
          type: array
          items:
            $ref: "#/components/schemas/WellnessAction"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WellnessStep"
        localizations:
          type: array
          items:
            $ref: "#/components/schemas/WellnessLocalization"

    WellnessProgramType:
      type: string
      enum: [SimpleReminder, GuidedRoutine]

    WellnessTheme:
      type: string
      enum: [Blue, Green]

    WellnessLayoutVariant:
      type: string
      enum: [ReminderCard, CountdownCard, OverviewCard, GuidedRoutine, CompletionCard]

    WellnessAction:
      type: object
      required: [actionKey, kind, label]
      properties:
        actionKey:
          type: string
        kind:
          $ref: "#/components/schemas/WellnessActionKind"
        label:
          type: string
        style:
          type: string
          enum: [Primary, Secondary, Ghost]
          nullable: true
        snoozeMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440

    WellnessActionKind:
      type: string
      enum: [GotIt, Done, Start, Next, Close, RemindMeLater]

    WellnessStep:
      type: object
      required: [stepKey, title, sortOrder]
      properties:
        stepKey:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        assetUrl:
          type: string
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3600
        sortOrder:
          type: integer

    WellnessLocalization:
      type: object
      required: [locale]
      properties:
        locale:
          type: string
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        instruction:
          type: string
          nullable: true

    CommunicationScheduleDetail:
      type: object
      required:
        - scheduleType
        - scheduleVersion
        - isActive
      properties:
        scheduleType:
          type: string
          enum: [Immediate, Scheduled, Recurring]
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        recurrenceRule:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        executionMode:
          allOf:
            - $ref: "#/components/schemas/ScheduleExecutionMode"
          nullable: true
        scheduleVersion:
          type: integer
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean

    ReminderPolicySummary:
      type: object
      required:
        - policyId
        - deviceId
        - scheduleVersion
        - recurrenceRule
        - timezone
        - isActive
      properties:
        policyId:
          type: string
        deviceId:
          type: string
        deviceIdentifier:
          type: string
          nullable: true
        hostname:
          type: string
          nullable: true
        scheduleVersion:
          type: integer
        recurrenceRule:
          type: string
        timezone:
          type: string
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ReminderEventRecord:
      type: object
      required:
        - eventId
        - policyId
        - deviceId
        - eventType
        - occurredAt
        - reportedAt
      properties:
        eventId:
          type: string
        policyId:
          type: string
        deviceId:
          type: string
        deviceIdentifier:
          type: string
          nullable: true
        hostname:
          type: string
          nullable: true
        eventType:
          type: string
          enum: [Triggered, Displayed, Read, Dismissed, Snoozed, Responded]
        occurredAt:
          type: string
          format: date-time
        reportedAt:
          type: string
          format: date-time
        activeUserIdentifier:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    ReminderActivityResponse:
      type: object
      required: [policies, events]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/ReminderPolicySummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ReminderEventRecord"

    TargetRule:
      type: object
      required: [targetType, targetValue]
      properties:
        targetType:
          $ref: "#/components/schemas/TargetType"
        targetValue:
          type: string

    AudiencePreviewResponse:
      type: object
      required: [totalRecipients, deviceRecipients, whatsappRecipients, previewWarnings, channelPlan, recipients]
      properties:
        totalRecipients:
          type: integer
        deviceRecipients:
          type: integer
        whatsappRecipients:
          type: integer
        previewWarnings:
          type: array
          items:
            type: string
        channelPlan:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPlanItem"
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientPreview"

    RecipientPreview:
      type: object
      properties:
        recipientType:
          $ref: "#/components/schemas/RecipientType"
        deviceId:
          type: string
          nullable: true
        employeeId:
          type: string
          nullable: true
        deviceId:
          type: string
          nullable: true
        deviceIdentifier:
          type: string
          nullable: true
        hostname:
          type: string
          nullable: true
        channelEndpoint:
          type: string
          nullable: true
        employeeNumber:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        siteName:
          type: string
          nullable: true
        areaName:
          type: string
          nullable: true
        departmentName:
          type: string
          nullable: true
        sectionName:
          type: string
          nullable: true
        availableChannels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    ChannelPlanItem:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        strategy:
          type: string
          enum: [Mandatory, Optional, DelayedFollowUp]
        plannedDelaySeconds:
          type: integer
          nullable: true

    WorkflowDefinition:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        allowFreeText:
          type: boolean
        requireFreeText:
          type: boolean
        escalationTimeoutMinutes:
          type: integer
          nullable: true
        escalationMode:
          type: string
          enum: [RecipientOnly]
        responseImpliesAck:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowOption"

    WorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string

    CommunicationTemplate:
      type: object
      required:
        - id
        - name
        - communicationType
        - defaultPriority
        - version
        - mandatoryChannels
        - optionalChannels
        - lockedFields
        - editableFields
      properties:
        id:
          type: string
        name:
          type: string
        communicationType:
          $ref: "#/components/schemas/CommunicationType"
        defaultPriority:
          $ref: "#/components/schemas/Priority"
        defaultChannels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        version:
          type: integer
        mandatoryChannels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        optionalChannels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        defaultWorkflowId:
          type: string
          nullable: true
        defaultWindowsAgentPresentation:
          allOf:
            - $ref: "#/components/schemas/WindowsAgentPresentation"
          nullable: true
        criticalBehaviorMode:
          allOf:
            - $ref: "#/components/schemas/CriticalBehaviorMode"
          nullable: true
        defaultDeliveryStrategy:
          allOf:
            - $ref: "#/components/schemas/DeliveryStrategy"
          nullable: true
        dualPathRule:
          allOf:
            - $ref: "#/components/schemas/DualPathRule"
          nullable: true
        allowedTargetTypes:
          type: array
          items:
            $ref: "#/components/schemas/TargetType"
        lockedFields:
          type: array
          items:
            type: string
        editableFields:
          type: array
          items:
            type: string

    TemplateListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationTemplate"
        page:
          $ref: "#/components/schemas/PageMeta"

    DualPathRule:
      type: object
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [DesktopFirstShortDelayWhatsApp]
        delaySeconds:
          type: integer
          nullable: true

    Site:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string

    Area:
      type: object
      required: [id, name, siteId]
      properties:
        id:
          type: string
        code:
          type: string
          nullable: true
        name:
          type: string
        siteId:
          type: string

    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        code:
          type: string
          nullable: true
        name:
          type: string
        siteId:
          type: string
          nullable: true

    Section:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        code:
          type: string
          nullable: true
        name:
          type: string
        departmentId:
          type: string
          nullable: true

    OrganizationReference:
      type: object
      required: [sites, areas, departments, sections]
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        areas:
          type: array
          items:
            $ref: "#/components/schemas/Area"
        departments:
          type: array
