services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MTI Alert Backend}
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: ${BACKEND_PORT:-4019}
      BACKEND_PUBLIC_BASE_URL: ${BACKEND_PUBLIC_BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLED_DELIVERY_CHANNELS: ${ENABLED_DELIVERY_CHANNELS:-WindowsAgent}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-480}
      AGENT_SESSION_TTL_MINUTES: ${AGENT_SESSION_TTL_MINUTES:-480}
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-ictMTIAlertHub}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_SSL_REJECT_UNAUTHORIZED: ${POSTGRES_SSL_REJECT_UNAUTHORIZED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_ALLOWED_GROUPS: ${LDAP_ALLOWED_GROUPS:-}
      LDAP_ALLOW_INSECURE_URL: ${LDAP_ALLOW_INSECURE_URL:-false}
      LDAP_SKIP_TLS_VERIFY: ${LDAP_SKIP_TLS_VERIFY:-false}
    command: ["sh", "-lc", "node backend/dist/scripts/run-migrations.js up && node backend/dist/index.js"]
    ports:
      - "${BACKEND_HOST_PORT:-4019}:${BACKEND_PORT:-4019}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.BACKEND_PORT || '4019') + '/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${DOCKER_VITE_API_URL:-/api}
        VITE_ENABLED_DELIVERY_CHANNELS: ${VITE_ENABLED_DELIVERY_CHANNELS:-DesktopAgent}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: ${FRONTEND_PORT:-8080}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT:-8080}
    expose:
      - "${FRONTEND_PORT:-8080}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '8080') + '/favicon.ico').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./docker/nginx.admin-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
